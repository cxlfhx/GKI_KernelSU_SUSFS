name: 摩托罗拉 G57 Power 官方源码内核构建

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      device_uname:
        description: "手机 uname -r 的完整输出（重要！用于对齐模块兼容性）"
        required: true
        type: string
        default: "6.6.87-android15-8-gf7bcb1c8e88f-ab14322536-4k"
      kernelsu_branch:
        description: "ReSukiSU 分支（留空=main）"
        required: false
        type: string
        default: ""
      use_susfs:
        description: "启用 SUSFS（Root 隐藏）"
        required: true
        type: boolean
        default: true
      use_zram:
        description: "启用 ZRAM 压缩增强（LZ4HC/842 + ARM NEON 加速）"
        required: false
        type: boolean
        default: true
      use_bfq:
        description: "启用 BFQ I/O 调度器（减少卡顿）"
        required: false
        type: boolean
        default: true
      use_bbg:
        description: "启用 BBG 基带保护（防格基带）"
        required: false
        type: boolean
        default: true
      use_usb_storage:
        description: "启用 exFAT + NTFS3 文件系统（U盘 OTG 读写）"
        required: false
        type: boolean
        default: true
      disable_debug_info:
        description: "关闭 DEBUG_INFO（加速编译、节省磁盘）"
        required: false
        type: boolean
        default: true
      cve_2026_43499_patch:
        description: "应用 CVE-2026-43499 安全补丁"
        required: false
        type: boolean
        default: true

jobs:
  build-motorola-kernel:
    name: "G57 Power (mumba) 6.6.87 ReSukiSU+"
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      # ==================== 构建信息摘要 ====================
      - name: 构建信息摘要
        run: |
          echo "========================================"
          echo "  摩托罗拉 G57 Power 官方源码内核构建 v4"
          echo "  + ZRAM + BFQ + BBG + exFAT/NTFS3"
          echo "  - Re-Kernel (已移除)"
          echo "  - DEBUG_INFO (可关闭加速编译)"
          echo "========================================"
          echo "设备        : Moto G57 Power (mumba)"
          echo "固件 tag    : MMI-W1WAAS36.48-12-23-3"
          echo "内核        : 6.6.87 (android15-6.6)"
          echo "KSU         : ReSukiSU (build-in)"
          echo "SUSFS       : ${{ inputs.use_susfs }}"
          echo "ZRAM增强    : ${{ inputs.use_zram }}"
          echo "BFQ调度器   : ${{ inputs.use_bfq }}"
          echo "BBG基带保护 : ${{ inputs.use_bbg }}"
          echo "exFAT/NTFS3 : ${{ inputs.use_usb_storage }}"
          echo "关闭DEBUG   : ${{ inputs.disable_debug_info }}"
          echo "uname 输入  : ${{ inputs.device_uname }}"
          echo "========================================"

      # ==================== 清理磁盘空间 ====================
      - name: 清理磁盘空间
        uses: endersonmenezes/free-disk-space@v3
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
          remove_packages_one_command: true
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"
          rm_cmd: "rmz"
          rmz_version: "3.1.1"
          testing: false

      # ==================== 检出仓库代码 ====================
      - name: 检出代码仓库
        uses: actions/checkout@v4

      # ==================== 安装编译依赖 ====================
      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex python3 \
            libssl-dev libelf-dev dwarves \
            clang lld llvm ccache zip wget

          echo "Clang 版本:"
          clang --version | head -3

      # ==================== 配置 Git ====================
      - name: 配置 Git
        run: |
          git config --global user.name "BuildBot"
          git config --global user.email "BuildMotoKernel@gmail.com"

      # ==================== 克隆摩托罗拉官方内核源码 ====================
      - name: 克隆摩托罗拉官方内核源码
        run: |
          for i in 1 2 3; do
            git clone --depth=1 -b MMI-W1WAAS36.48-12-23-3 \
              https://github.com/MotorolaMobilityLLC/kernel-msm.git kernel_src && break
            echo "第 $i 次克隆失败，10 秒后重试..."
            rm -rf kernel_src
            sleep 10
          done

          if [ ! -d "kernel_src" ]; then
            echo "::error::克隆摩托罗拉内核源码失败"
            exit 1
          fi

          echo "内核源码版本确认:"
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL)' kernel_src/Makefile

      # ==================== 添加 ReSukiSU ====================
      - name: 添加 ReSukiSU (build-in 模式)
        working-directory: kernel_src
        run: |
          BRANCH="${{ inputs.kernelsu_branch }}"
          if [ -z "$BRANCH" ]; then
            BRANCH="main"
          fi
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s "$BRANCH"

          if [ -d "KernelSU/.git" ]; then
            KSU_COMMIT_DATE=$(git -C KernelSU log -1 --date=format:'%Y-%m-%d %H:%M:%S %z' --format='%cd')
            echo "ReSukiSU 最新提交日期: $KSU_COMMIT_DATE"
          fi

      # ==================== 克隆 SUSFS ====================
      - name: 克隆 SUSFS
        if: inputs.use_susfs
        run: |
          for i in 1 2 3; do
            git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android15-6.6 && break
            echo "第 $i 次克隆失败，10 秒后重试..."
            rm -rf susfs4ksu
            sleep 10
          done
          SUSFS_COMMIT_DATE=$(git -C susfs4ksu log -1 --date=format:'%Y-%m-%d %H:%M:%S %z' --format='%cd')
          echo "SUSFS 最新提交日期: $SUSFS_COMMIT_DATE"

      # ==================== 应用 SUSFS 补丁 ====================
      - name: 应用 SUSFS 补丁
        if: inputs.use_susfs
        working-directory: kernel_src
        run: |
          cp $GITHUB_WORKSPACE/susfs4ksu/kernel_patches/50_add_susfs_in_gki-android15-6.6.patch ./
          cp $GITHUB_WORKSPACE/susfs4ksu/kernel_patches/fs/* ./fs/
          cp $GITHUB_WORKSPACE/susfs4ksu/kernel_patches/include/linux/* ./include/linux/

          # 6.6.50~92: base.c 头部上下文调整
          if ! grep -qF '#include <linux/dma-buf.h>' fs/proc/base.c; then
            sed -i '/^#include <linux\/cpufreq_times.h>$/a #include <linux\/dma-buf.h>' fs/proc/base.c
          fi

          patch -p1 < 50_add_susfs_in_gki-android15-6.6.patch || true

          # 6.6.50~97 已知问题修复: base.c 缺少 susfs_def.h
          if grep -q 'AS_FLAGS_SUS_MAP\|susfs_is_current_proc_umounted\|SUSFS_IS_INODE_SUS_MAP\|SUSFS_IS_INODE_OPEN_REDIRECT' ./fs/proc/base.c && ! grep -qF 'susfs_def.h' ./fs/proc/base.c; then
            sed -i '/#include <linux\/dma-buf.h>/a #endif' ./fs/proc/base.c
            sed -i '/#include <linux\/dma-buf.h>/a #include <linux\/susfs_def.h>' ./fs/proc/base.c
            sed -i '/#include <linux\/dma-buf.h>/a #if defined(CONFIG_KSU_SUSFS_SUS_MAP) || defined(CONFIG_KSU_SUSFS_OPEN_REDIRECT)' ./fs/proc/base.c
            echo "已修复 base.c 缺少 susfs_def.h 问题"
          fi

          # 6.6 已知问题修复: memory.c 缺少 susfs_def.h
          if grep -q 'SUSFS_IS_INODE_SUS_MAP' ./mm/memory.c && ! grep -qF '#include <linux/susfs_def.h>' ./mm/memory.c; then
            if grep -qF '#include <linux/zswap.h>' ./mm/memory.c; then
              sed -i '/#include <linux\/zswap.h>/a #ifdef CONFIG_KSU_SUSFS_SUS_MAP\n#include <linux\/susfs_def.h>\n#endif' ./mm/memory.c
            else
              sed -i '/#include <linux\/sched\/sysctl.h>/a #ifdef CONFIG_KSU_SUSFS_SUS_MAP\n#include <linux\/susfs_def.h>\n#endif' ./mm/memory.c
            fi
            echo "已修复 memory.c 缺少 susfs_def.h 问题"
          fi

          REJ_COUNT=$(find . -name "*.rej" | wc -l)
          echo "SUSFS 补丁冲突文件数: $REJ_COUNT"
          find . -name "*.rej" | head -10

      # ==================== CVE 安全补丁 ====================
      - name: 应用 CVE-2026-43499 安全补丁
        if: inputs.cve_2026_43499_patch
        working-directory: kernel_src
        run: |
          if [ -f "$GITHUB_WORKSPACE/security_patch/apply_cve_2026_43499.sh" ]; then
            bash "$GITHUB_WORKSPACE/security_patch/apply_cve_2026_43499.sh" "6.6" "87" "$GITHUB_WORKSPACE/security_patch" || echo "::warning::CVE 补丁应用出现问题，继续构建"
          else
            echo "未找到 CVE 补丁脚本，跳过"
          fi

      # ==================== ZRAM 压缩增强 ====================
      - name: 集成 ZRAM 压缩增强（LZ4HC/842 + ARM NEON 加速）
        if: inputs.use_zram
        working-directory: kernel_src
        run: |
          echo "=== 集成 ZRAM 压缩增强 ==="

          ZRAM_DIR="$GITHUB_WORKSPACE/zram"

          if [ -d "$ZRAM_DIR/lz4" ]; then
            echo "替换 LZ4 源码为 NEON 加速版..."
            cp -f "$ZRAM_DIR/lz4/lz4.c" lib/lz4/lz4_decompress.c 2>/dev/null || true
            cp -f "$ZRAM_DIR/lz4/lz4.h" lib/lz4/ 2>/dev/null || true
            cp -f "$ZRAM_DIR/lz4/lz4hc.c" lib/lz4/ 2>/dev/null || true
            cp -f "$ZRAM_DIR/lz4/lz4hc.h" lib/lz4/ 2>/dev/null || true

            if [ -d "$ZRAM_DIR/lz4/lz4armv8" ]; then
              mkdir -p lib/lz4/lz4armv8
              cp -f "$ZRAM_DIR/lz4/lz4armv8/"* lib/lz4/lz4armv8/ 2>/dev/null || true
            fi

            if [ -f "$ZRAM_DIR/include/linux/lz4.h" ]; then
              cp -f "$ZRAM_DIR/include/linux/lz4.h" include/linux/lz4.h
            fi

            cp -f "$ZRAM_DIR/lz4/Makefile" lib/lz4/Makefile 2>/dev/null || true
            echo "LZ4 NEON 源码已复制"
          fi

          if [ -f "$ZRAM_DIR/apply_lz4_neon.sh" ]; then
            echo "应用 LZ4 NEON 调用补丁..."
            bash "$ZRAM_DIR/apply_lz4_neon.sh" || echo "::warning::部分 NEON 补丁可能未应用，继续构建"
          fi

          echo "ZRAM 压缩增强集成完成"

      # ==================== BBG 基带保护 ====================
      - name: 集成 BBG 基带保护
        if: inputs.use_bbg
        working-directory: kernel_src
        run: |
          echo "=== 集成 BBG 基带保护 ==="
          wget -O- https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash || {
            echo "::warning::BBG 安装脚本执行失败，尝试手动安装..."
            TMP_BBG=/tmp/baseband-guard
            rm -rf "$TMP_BBG"
            git clone --depth=1 https://github.com/vc-teahouse/Baseband-guard.git "$TMP_BBG" || {
              echo "::warning::BBG 克隆失败，跳过"
              exit 0
            }
            if [ -f "$TMP_BBG/setup.sh" ]; then
              bash "$TMP_BBG/setup.sh" || echo "::warning::BBG 手动安装失败，跳过"
            fi
          }
          echo "BBG 基带保护集成完成"

      # ==================== 配置内核版本字符串 ====================
      - name: 配置内核版本字符串（对齐 uname）
        working-directory: kernel_src
        run: |
          FULL_UNAME="${{ inputs.device_uname }}"
          SUFFIX=$(echo "$FULL_UNAME" | sed -E 's/^6\.6\.[0-9]+//')

          if [ -z "$SUFFIX" ]; then
            echo "::error::无法从输入中解析出 localversion 后缀"
            exit 1
          fi

          echo "目标内核版本字符串: 6.6.87$SUFFIX"

          sed -i 's/-dirty//' ./scripts/setlocalversion || true
          perl -i -0777 -pe 's/(.*)echo "\$\{KERNELVERSION\}\$\{file_localversion\}\$\{config_localversion\}\$\{LOCALVERSION\}\$\{scm_version\}"/$1echo "\$\{KERNELVERSION\}'"$SUFFIX"'"/s' ./scripts/setlocalversion || true

          tail -3 ./scripts/setlocalversion

          echo "KBUILD_BUILD_TIMESTAMP=Thu Oct 23 14:31:17 UTC 2025" >> $GITHUB_ENV
          echo "KBUILD_BUILD_VERSION=1" >> $GITHUB_ENV

      # ==================== 写入全部内核配置 ====================
      - name: 写入内核配置（KSU + SUSFS + ZRAM + BFQ + BBG + exFAT/NTFS3）
        working-directory: kernel_src
        run: |
          DEFCONFIG="arch/arm64/configs/gki_defconfig"

          # --- KSU 基础 ---
          cat >> "$DEFCONFIG" << 'EOF'
          CONFIG_KSU=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          EOF

          # --- SUSFS ---
          if [ "${{ inputs.use_susfs }}" = "true" ]; then
            cat >> "$DEFCONFIG" << 'EOF'
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          EOF
          fi

          # --- ZRAM 压缩增强 ---
          if [ "${{ inputs.use_zram }}" = "true" ]; then
            cat >> "$DEFCONFIG" << 'EOF'
          CONFIG_ZRAM=y
          CONFIG_ZRAM_WRITEBACK=y
          CONFIG_ZRAM_MULTI_COMP=y
          CONFIG_ZSMALLOC=y
          CONFIG_CRYPTO_LZ4HC=y
          CONFIG_CRYPTO_LZ4K=y
          CONFIG_CRYPTO_842=y
          CONFIG_CRYPTO_LZ4=y
          CONFIG_CRYPTO_LZO=y
          EOF
          fi

          # --- BFQ I/O 调度器 ---
          if [ "${{ inputs.use_bfq }}" = "true" ]; then
            cat >> "$DEFCONFIG" << 'EOF'
          CONFIG_IOSCHED_BFQ=y
          CONFIG_BFQ_GROUP_IOSCHED=y
          EOF
          fi

          # --- BBG 基带保护 ---
          if [ "${{ inputs.use_bbg }}" = "true" ]; then
            echo "CONFIG_BBG=y" >> "$DEFCONFIG"
            sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' security/Kconfig 2>/dev/null || true
          fi

          # --- exFAT + NTFS3 文件系统（U盘 OTG）---
          if [ "${{ inputs.use_usb_storage }}" = "true" ]; then
            cat >> "$DEFCONFIG" << 'EOF'
          CONFIG_EXFAT_FS=y
          CONFIG_NTFS3_FS=y
          CONFIG_VFAT_FS=y
          CONFIG_FAT_DEFAULT_CODEPAGE=437
          CONFIG_FAT_DEFAULT_IOCHARSET="utf8"
          EOF
          fi

          # --- 关闭 DEBUG_INFO（加速编译）---
          if [ "${{ inputs.disable_debug_info }}" = "true" ]; then
            cat >> "$DEFCONFIG" << 'EOF'
          # CONFIG_DEBUG_INFO_DWARF5 is not set
          CONFIG_DEBUG_INFO_NONE=y
          # CONFIG_DEBUG_INFO_BTF is not set
          # CONFIG_DEBUG_INFO_COMPRESSED_ZSTD is not set
          EOF
          fi

          # 去掉行首缩进
          sed -i 's/^[[:space:]]*//' "$DEFCONFIG"

          echo "=== 已追加的全部配置 ==="
          tail -40 "$DEFCONFIG"

      # ==================== 编译内核 ====================
      - name: 编译内核
        working-directory: kernel_src
        run: |
          set -ex

          make ARCH=arm64 LLVM=1 LLVM_IAS=1 gki_defconfig

          echo "=== 关键配置确认 ==="
          grep -E "^CONFIG_KSU=|^CONFIG_KSU_SUSFS=|^CONFIG_ZRAM=|^CONFIG_IOSCHED_BFQ=|^CONFIG_BBG=|^CONFIG_EXFAT_FS=|^CONFIG_NTFS3_FS=|^CONFIG_DEBUG_INFO" .config || true

          # 编译内核（pipefail 确保编译失败时正确报错）
          set -o pipefail
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 -j$(nproc) Image 2>&1 | tail -200

          echo "=== 检查编译产物 ==="
          ls -la arch/arm64/boot/Image* 2>/dev/null || {
            echo "::error::编译产物 Image 不存在！编译可能失败"
            echo "=== 最后 50 行编译日志 ==="
            make ARCH=arm64 LLVM=1 LLVM_IAS=1 -j1 Image 2>&1 | tail -50
            exit 1
          }

      # ==================== 验证内核 ====================
      - name: 验证内核版本字符串
        working-directory: kernel_src
        run: |
          EXPECTED="${{ inputs.device_uname }}"
          ACTUAL=$(strings arch/arm64/boot/Image | grep -m1 'Linux version' || true)
          echo "Image 内版本信息: $ACTUAL"

          if echo "$ACTUAL" | grep -qF "$EXPECTED"; then
            echo "✅ 内核版本字符串与原厂一致"
          else
            echo "::warning::内核版本字符串与预期不完全一致"
          fi

      # ==================== 创建 AnyKernel3 刷机包 ====================
      - name: 创建 AnyKernel3 刷机包
        run: |
          for i in 1 2 3; do
            git clone --depth=1 https://github.com/ReSukiSU-GKI/AnyKernel3.git && break
            sleep 10
          done

          cp kernel_src/arch/arm64/boot/Image AnyKernel3/Image

          cd AnyKernel3
          ZIP_NAME="ReSukiSU-mumba-G57Power-6.6.87-Enhanced-AnyKernel3.zip"
          zip -r9 "../$ZIP_NAME" ./*

          echo "打包完成:"
          ls -la "../$ZIP_NAME"

      # ==================== 收集补丁冲突文件 ====================
      - name: 收集补丁冲突文件
        if: always()
        run: |
          REJECTS_DIR="$GITHUB_WORKSPACE/patch-rejects"
          mkdir -p "$REJECTS_DIR"

          mapfile -t REJS < <(find "$GITHUB_WORKSPACE/kernel_src" -type f -name '*.rej' 2>/dev/null)
          REJ_COUNT=${#REJS[@]}
          echo "发现 $REJ_COUNT 个 .rej 文件"
          echo "REJ_COUNT=$REJ_COUNT" >> $GITHUB_ENV

          if [ "$REJ_COUNT" -gt 0 ]; then
            for REJ in "${REJS[@]}"; do
              REL="${REJ#"$GITHUB_WORKSPACE/kernel_src"/}"
              DEST="$REJECTS_DIR/$REL"
              mkdir -p "$(dirname "$DEST")"
              cp "$REJ" "$DEST"
              echo "$REL" >> "$REJECTS_DIR/index.txt"
            done
          fi

      # ==================== 上传构建产物 ====================
      - name: 上传 AnyKernel3 刷机包
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ReSukiSU-G57Power-6.6.87-Enhanced
          path: '*AnyKernel3.zip'
          compression-level: 0
          retention-days: 30

      - name: 上传补丁冲突文件
        if: always() && env.REJ_COUNT > 0
        uses: actions/upload-artifact@v4
        with:
          name: moto-build-patch-rejects
          path: patch-rejects/
          if-no-files-found: ignore

      # ==================== 构建摘要 ====================
      - name: 构建摘要
        if: success()
        run: |
          echo "========================================"
          echo "  构建成功！增强版内核 v4"
          echo "  功能清单:"
          echo "  ✅ ReSukiSU (build-in)"
          echo "  ✅ SUSFS (Root 隐藏)"
          echo "  ✅ ZRAM 压缩增强 (NEON 加速)"
          echo "  ✅ BFQ I/O 调度器"
          echo "  ✅ BBG 基带保护"
          echo "  ✅ exFAT + NTFS3 (U盘 OTG)"
          echo "  ✅ BBR 拥塞控制 (内核自带)"
          echo "  ✅ WireGuard VPN (内核自带)"
          echo "  ✅ OverlayFS (内核自带)"
          echo "  ⚡ DEBUG_INFO 已关闭 (编译更快)"
          echo "========================================"
